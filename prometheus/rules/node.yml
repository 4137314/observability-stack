groups:
  - name: node
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is not reachable"
          description: "node_exporter on {{ $labels.instance }} has not been scraped for 3 minutes."

      - alert: HostFilesystemAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes) < 0.10
          and node_filesystem_readonly == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} has less than 10% free space"

      - alert: HostFilesystemFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and node_filesystem_readonly == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} will be full within 24h at the current rate"

      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} has less than 5% memory available"

      - alert: HostHighCpuLoad
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} CPU above 90% for 30 minutes"

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.instance }}"

      - alert: HostRebootRequired
        expr: node_reboot_required > 0
        for: 3d
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.instance }} has been waiting for a reboot for 3 days"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} clock is off by more than 0.5s"
