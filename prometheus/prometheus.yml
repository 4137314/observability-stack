global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/rules/*.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

# Add hosts by dropping YAML files into prometheus/targets/ (reloaded automatically):
#   - targets: ["web01.example.com:9100"]
#     labels: {env: production, role: web}
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  - job_name: node
    file_sd_configs: [{files: [/etc/prometheus/targets/node*.yml]}]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+)(:[0-9]+)?"
        target_label: instance
        replacement: "$1"

  - job_name: blackbox_http
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs: [{files: [/etc/prometheus/targets/http*.yml]}]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
